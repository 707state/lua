[package]
name = "webapp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "webapp"
path = "src/main.rs"

[dependencies]
# Yew 前端框架，csr = 客户端渲染（适合 wasm32-unknown-unknown）
yew = { version = "0.21", features = ["csr"] }

# wasm-bindgen：Rust ↔ JS 桥接
wasm-bindgen = "0.2"

# web-sys：浏览器 Web API 绑定
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "console",
] }
log = "0.4"
console_log = "1.0"
# 引用同 workspace 的 Lua 核心库
lua = { path = ".." }
console_error_panic_hook = "0.1"