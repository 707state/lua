[package]
name = "webapp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "webapp"
path = "src/main.rs"

[dependencies]
# Yew 前端框架，csr = 客户端渲染（适合 wasm32-unknown-unknown）
yew = { version = "0.21", features = ["csr"] }

# wasm-bindgen：Rust ↔ JS 桥接
wasm-bindgen = "0.2"

# web-sys：浏览器 Web API 绑定
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlTextAreaElement",
    "Element",
    "Node",
    "DomTokenList",
    "CssStyleDeclaration",
    "console",
    # Audio player features
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "BaseAudioContext",
    "Blob",
    "File",
    "FileList",
    "HtmlInputElement",
    "Event",
    "EventTarget",
] }
js-sys = "0.3"
log = "0.4"
console_log = "1.0"
# 引用同 workspace 的 Lua 核心库
lua = { path = ".." }
console_error_panic_hook = "0.1"
wgpu = { version = "29.0.1", features = ["webgl", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen-futures = "0.4"
