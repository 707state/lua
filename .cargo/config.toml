# ── WASM 目标配置 ──────────────────────────────────────────────────────────────
#
# 错误传播机制已重构为 JS try/catch 桥接方案：
#
#   luaD_throw (WASM)           → wasm_bindgen::throw_str("__lua__N")
#                                  抛出 JS 字符串异常（-> ! 语义保持）
#   luaD_rawrunprotected (WASM) → js_sys::Function 构造 JS try/catch 包装器，
#                                  捕获异常并返回错误码给 Rust
#
# 此方案不依赖 WASM Exception Handling 提案（无需 +exception-handling 标志），
# 通过 wasm-bindgen 的 JS 互操作实现非局部跳转语义。
#
# native 平台仍使用原有的 catch_unwind 方案（不受此配置影响）。
